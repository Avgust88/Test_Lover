<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Анечка ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 15%,#ffb8d6 0,rgba(255,184,214,.2) 25%,transparent 45%),
    linear-gradient(160deg,#ef6fa7 0%,#c83b7e 48%,#67113f 100%);
  font-family:Arial,sans-serif;color:#fff;
}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.heart{position:absolute;color:rgba(255,240,248,.5);font-size:18px;animation:up linear infinite}
@keyframes up{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;transition:.8s}
.hidden{opacity:0;pointer-events:none;transform:scale(.97)}
.intro{text-align:center;text-shadow:0 5px 25px rgba(100,5,55,.5);animation:appear 1.7s ease}
.intro small{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.8;margin-bottom:14px}
.intro h1{font-family:Georgia,serif;font-size:clamp(38px,10vw,58px);line-height:1.04;margin:0}
@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.stage{
 width:min(92vw,430px);
 height:min(82vh,610px);
 min-height:520px;
 position:relative;
 border-radius:28px;
 overflow:hidden;
 background:
   radial-gradient(circle at 70% 18%,rgba(255,255,255,.1),transparent 25%),
   linear-gradient(160deg,#d94b8d,#a62966 50%,#5b1039);
 box-shadow:0 25px 55px rgba(45,0,25,.32),inset 0 0 0 1px rgba(255,255,255,.16);
}
.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:53px 53px;opacity:.3}

.envelope{
 position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
 width:min(84%,370px);aspect-ratio:1.62;cursor:pointer;
 filter:drop-shadow(0 18px 18px rgba(30,0,20,.4));
}
.env-base{
 position:absolute;inset:0;border-radius:16px;background:#f9f8fc;
 box-shadow:inset 0 0 0 1px #fff,0 0 0 1px rgba(50,10,40,.12);overflow:hidden;
}
.env-base:before{
 content:"";position:absolute;inset:0;
 background:linear-gradient(32deg,transparent 49.6%,#d9d5df 50%,transparent 50.5%),
 linear-gradient(148deg,transparent 49.6%,#d9d5df 50%,transparent 50.5%);
 opacity:.8;
}
.env-pocket{
 position:absolute;z-index:4;left:0;right:0;bottom:0;height:76%;
 background:linear-gradient(145deg,#f5f4f8,#e6e4eb);
 clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);
 border-radius:0 0 16px 16px;
}
.env-flap{
 position:absolute;z-index:7;left:0;top:0;width:100%;height:59%;
 background:linear-gradient(145deg,#ffffff,#e8e6ee);
 clip-path:polygon(0 0,100% 0,50% 100%);
 transform-origin:50% 0;
 transition:transform 1s cubic-bezier(.2,.8,.2,1);
}
.seal{
 position:absolute;z-index:10;left:50%;top:53%;transform:translate(-50%,-50%);
 width:64px;height:64px;border-radius:50%;
 background:radial-gradient(circle at 35% 28%,#d6b0ff,#9a63c7 58%,#6e3c9c);
 border:4px solid #ad78d8;color:#e9d8ff;
 display:flex;align-items:center;justify-content:center;
 font:32px Georgia,serif;
 box-shadow:0 5px 12px rgba(55,0,70,.35),0 0 20px rgba(214,176,255,.45);
 transition:.55s;
}
.env-name{
 position:absolute;z-index:10;left:0;right:0;top:69%;text-align:center;
 color:#575067;font:600 34px "Brush Script MT",cursive;
}
.open .env-flap{transform:rotateX(180deg);z-index:2}
.open .seal,.open .env-name{opacity:0;transform:translate(-50%,-50%) scale(.7)}
.env-name{transition:.55s}

.hint{
 position:absolute;left:0;right:0;top:65%;
 text-align:center;font:500 clamp(25px,7vw,31px) "Brush Script MT",cursive;
 color:#f1d9ea;z-index:2;transition:.5s;
}
.open~.hint{opacity:0;transform:translateY(12px)}

.letter{
 position:absolute;z-index:12;left:8%;right:8%;top:15%;
 height:56%;
 background:linear-gradient(180deg,#fffaff,#f8f2fb);
 border-radius:18px;color:#24203e;
 padding:24px 22px;
 box-shadow:0 18px 30px rgba(25,0,25,.35);
 opacity:0;transform:translateY(70px) scale(.97);
 transition:1s cubic-bezier(.2,.8,.2,1);
 display:flex;flex-direction:column;justify-content:center;
}
.open .letter{opacity:1;transform:translateY(0) scale(1)}
.to{font:600 clamp(25px,7vw,32px) "Brush Script MT",cursive;color:#ad78ce;margin-bottom:14px}
.msg{font:500 clamp(20px,5.8vw,27px) "Brush Script MT",cursive;line-height:1.3}
.sign{font:500 clamp(20px,5.5vw,26px) "Brush Script MT",cursive;color:#817398;text-align:right;margin-top:18px}
.cta{
 position:absolute;z-index:13;left:8%;right:8%;bottom:11%;
 border:0;border-radius:999px;padding:16px 14px;
 background:linear-gradient(135deg,#ffd982,#ffc65c);
 color:#392039;font-size:15px;font-weight:700;
 box-shadow:0 10px 24px rgba(40,0,30,.3);
 opacity:0;transform:translateY(15px);transition:.7s .3s;cursor:pointer;
}
.open .cta{opacity:1;transform:none}
@media(max-height:700px){
 .stage{height:86vh;min-height:460px}
 .envelope{top:39%}
 .letter{top:11%;height:57%;padding:18px}
 .msg{font-size:20px}.sign{margin-top:10px;font-size:20px}
 .cta{bottom:8%;padding:13px}
 .hint{top:64%}
}
@media(max-width:360px){
 .stage{width:96vw}
 .letter{left:6%;right:6%;padding:17px}
 .to{font-size:24px}.msg{font-size:18px}.sign{font-size:19px}
 .cta{left:6%;right:6%;font-size:13px}
}
</style>
</head>
<body>
<div id="bg"></div>

<section id="intro" class="screen">
 <div class="intro">
  <small>маленькое послание</small>
  <h1>Анечка,<br>это тебе ❤️</h1>
 </div>
</section>

<section id="main" class="screen hidden">
 <div class="stage">
  <div id="envelope" class="envelope" onclick="openEnvelope()">
   <div class="env-base"></div>
   <div class="env-flap"></div>
   <div class="env-pocket"></div>
   <div class="seal">A</div>
   <div class="env-name">Анечка</div>
   <div class="letter">
    <div class="to">это тебе, любимая ❤️</div>
    <div class="msg">Анечка, спасибо, что ты всегда рядом со мной, очень сильно тебя люблю!</div>
    <div class="sign">Твой любимый мальчик</div>
   </div>
  </div>
  <div id="hint" class="hint">нажми на конверт</div>
  <button class="cta" onclick="go(event)">я люблю тебя, нажми сюда ❤️</button>
 </div>
</section>

<script>
setTimeout(()=>{document.getElementById('intro').classList.add('hidden');document.getElementById('main').classList.remove('hidden')},3000);
function openEnvelope(){
 document.getElementById('envelope').classList.add('open');
 document.getElementById('hint').style.opacity='0';
 document.getElementById('hint').style.transform='translateY(12px)';
}
function go(e){
 e.stopPropagation();
 location.href='https://www.tiktok.com/@in.the.night.vibe/video/7681007046187257109';
}
for(let i=0;i<32;i++){
 const h=document.createElement('span');h.className='heart';
 h.textContent=Math.random()>.2?'♥':'♡';
 h.style.left=Math.random()*100+'vw';
 h.style.animationDelay=(-Math.random()*9)+'s';
 h.style.animationDuration=(6+Math.random()*8)+'s';
 h.style.fontSize=(12+Math.random()*19)+'px';
 document.getElementById('bg').appendChild(h);
}
</script>
</body>
</html>
